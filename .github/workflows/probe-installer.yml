name: Probe installer

on:
  workflow_dispatch:
  push:
    tags:
      - "probe-v*"

env:
  CI: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Echo Probe dependencies
        working-directory: apps/echo-probe
        run: pnpm install --frozen-lockfile

      - name: Build Echo Probe (Windows, system tray)
        working-directory: apps/echo-probe
        run: pnpm tauri build -- --features system-tray

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/echo-probe/src-tauri/target/release/bundle -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Recurse apps/echo-probe/src-tauri/target/release/bundle -ErrorAction SilentlyContinue
            throw "No Windows probe installer (*-setup.exe) found"
          }
          Write-Host "Installer ready: $($exe.FullName)"

      - name: Publish GitHub Release (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path apps/echo-probe/src-tauri/Cargo.toml -Pattern '^version = ' | ForEach-Object { $_ -replace 'version = "(.+)"', '$1' }).ToString().Trim()
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          } else {
            $tag = "probe-v$version"
          }
          $assets = Get-ChildItem -Path apps/echo-probe/src-tauri/target/release/bundle -Recurse -Include *-setup.exe | ForEach-Object { $_.FullName }
          if ($assets.Count -eq 0) { throw "No Windows release assets found" }
          $notesFile = New-TemporaryFile
          node --input-type=module -e "import { probeReleaseNotes } from './scripts/probe-release-notes.mjs'; console.log(probeReleaseNotes('$version'))" | Set-Content -Path $notesFile -Encoding utf8
          if (gh release view $tag 2>$null) {
            foreach ($asset in $assets) { gh release upload $tag $asset --clobber }
            gh release edit $tag --notes-file $notesFile
          } else {
            gh release create $tag --title "Echo Probe $version" --notes-file $notesFile -- $assets
          }

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Echo Probe dependencies
        working-directory: apps/echo-probe
        run: pnpm install --frozen-lockfile

      - name: Build Echo Probe (macOS, no tray — macOS 15 safe)
        working-directory: apps/echo-probe
        run: pnpm tauri build -- --no-default-features

      - name: Verify macOS bundle
        run: |
          set -euo pipefail
          APP="$(find apps/echo-probe/src-tauri/target/release/bundle -name 'Echo-Probe.app' | head -1)"
          test -n "$APP" || (find apps/echo-probe/src-tauri/target/release/bundle -maxdepth 4 && exit 1)
          echo "App ready: $APP"

      - name: Publish GitHub Release (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^version = ' apps/echo-probe/src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="probe-v${version}"
          fi
          assets=()
          while IFS= read -r file; do
            assets+=("$file")
          done < <(find apps/echo-probe/src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.pkg' \))
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS probe assets found — uploading .app zip fallback"
            app="$(find apps/echo-probe/src-tauri/target/release/bundle -name 'Echo-Probe.app' | head -1)"
            zip -r "/tmp/Echo-Probe_${version}_macos.zip" "$app"
            assets=("/tmp/Echo-Probe_${version}_macos.zip")
          fi
          notes_file="$(mktemp)"
          node --input-type=module -e "import { probeReleaseNotes } from './scripts/probe-release-notes.mjs'; console.log(probeReleaseNotes('${version}'))" > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" "${assets[@]}" --title "Echo Probe ${version}" --notes-file "$notes_file"
          fi
